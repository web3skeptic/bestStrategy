<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replays Browser</title>
  <style>
    @font-face { font-family: 'Lilita One'; src: url('fonts/LilitaOne.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url('fonts/Nunito.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a1510;
      color: #fff4dc;
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      min-height: 100%;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      overflow-x: auto; /* the results table is wider than a phone */
    }
    h1 {
      font-family: 'Lilita One', 'Nunito', sans-serif; letter-spacing: .04em;
      font-size: 22px;
      color: #f5c451;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: rgba(255,244,220,.5);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 14px;
      background: rgba(13,31,20,.9);
      border: 1px solid rgba(255,244,220,.12);
      border-radius: 8px;
    }
    .controls input[type="search"] {
      flex: 1;
      min-width: 220px;
      padding: 8px 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,244,220,.12);
      border-radius: 6px;
      color: #fff4dc;
      font-size: 14px;
      font-family: inherit;
    }
    .controls input[type="search"]:focus { outline: none; border-color: #f5c451; }
    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,244,220,.7);
      user-select: none;
      cursor: pointer;
    }
    .controls input[type="checkbox"] { accent-color: #f5c451; }
    .controls button {
      padding: 8px 14px;
      background: rgba(255,244,220,.08);
      border: 1px solid rgba(255,244,220,.16);
      border-radius: 6px;
      color: #f5c451;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    .controls button:hover { background: rgba(255,244,220,.14); }
    .stats {
      color: rgba(255,244,220,.5);
      font-size: 12px;
      margin-bottom: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(9,22,14,.9);
      border: 1px solid rgba(255,244,220,.12);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }
    thead {
      background: rgba(255,244,220,.06);
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: rgba(255,244,220,.7);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid rgba(255,244,220,.12);
      white-space: nowrap;
    }
    th:hover { color: #f5c451; }
    th .arrow {
      display: inline-block;
      width: 12px;
      color: #f5c451;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,244,220,.1);
    }
    tbody tr:hover { background: rgba(50,50,100,0.25); }
    .gid {
      font-family: monospace;
      font-size: 11px;
      color: #f5c451;
    }
    .winner-cell { color: #8c8; font-weight: 500; }
    .winner-cell.none { color: #888; font-style: italic; }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-timeout { background: #553; color: #eb7; }
    .badge-live    { background: #353; color: #8d8; }
    a.watch {
      color: #f5c451;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid #345;
      border-radius: 4px;
      font-size: 12px;
    }
    a.watch:hover { background: rgba(100,200,255,0.1); }
    .empty {
      text-align: center;
      padding: 40px;
      color: rgba(255,244,220,.5);
    }
    .error {
      padding: 12px;
      background: rgba(150,40,40,0.2);
      border: 1px solid #844;
      color: #faa;
      border-radius: 6px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Replays</h1>
    <p class="subtitle">Browse and search all recorded games. Click a column to sort; type to filter.</p>

    <div id="errorBox"></div>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="Search by player name, winner, or game id…" autocomplete="off">
      <label><input type="checkbox" id="finishedOnly"> Finished only</label>
      <label><input type="checkbox" id="winsOnly"> Decisive only</label>
      <button id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="stats" id="stats">Loading…</div>

    <table id="table">
      <thead>
        <tr>
          <th data-sort="createdAt">When <span class="arrow"></span></th>
          <th data-sort="player1Name">Player 1 <span class="arrow"></span></th>
          <th data-sort="player2Name">Player 2 <span class="arrow"></span></th>
          <th data-sort="winnerName">Winner <span class="arrow"></span></th>
          <th data-sort="eventCount" style="text-align: right;">Events <span class="arrow"></span></th>
          <th data-sort="durationSec" style="text-align: right;">Duration <span class="arrow"></span></th>
          <th data-sort="gameId">Game ID <span class="arrow"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <script type="module" src="./src/replays.ts"></script>
</body>
</html>
